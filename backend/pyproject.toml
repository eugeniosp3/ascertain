[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ascertain-backend"
version = "0.1.0"
description = "FastAPI backend for the Ascertain patient dashboard"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "patient-data",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.2,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "node_modules", "artifacts"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.uv.sources]
patient-data = { path = "../data", editable = true }
