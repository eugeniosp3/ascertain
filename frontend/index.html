<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f3ef" />
    <script>
      // Match the UI store's validated preference before the first stylesheet paints.
      ;(() => {
        let theme = 'dark'
        try {
          const saved = JSON.parse(localStorage.getItem('ascertain:ui-preferences') || 'null')
          const value = saved?.state?.theme
          if (
            (typeof saved?.version !== 'number' || saved.version === 1) &&
            (value === 'light' || value === 'dark' || value === 'system')
          )
            theme = value
        } catch {
          // Preference storage is optional, including in private or restricted browsing.
        }
        let dark = theme === 'dark'
        if (theme === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch {
            dark = false
          }
        }
        const resolved = dark ? 'dark' : 'light'
        document.documentElement.classList.add(resolved)
        document.documentElement.style.colorScheme = resolved
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', resolved)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#1e1d1c' : '#f4f3ef')
      })()
    </script>
    <meta name="description" content="Ascertain patient workspace" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ascertain · Patient workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
