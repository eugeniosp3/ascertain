# Docker DNS updates after a backend container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api {
    zone api 64k;
    server backend:8000 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        # nginx upstream errors include the raw request URL; the status-only
        # access summary and the backend's redacted errors provide diagnostics.
        error_log /dev/null;
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite fingerprints these filenames. Missing files must not gain immutable caching.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|html)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
